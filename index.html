<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberScan – Threat Lookup Dashboard</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- CSS propriu -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark fixed-top" id="mainNav">
        <div class="container">
            <a class="navbar-brand" href="#">
                <i class="fas fa-shield-alt me-2"></i>CyberScan
            </a>
            <div class="ms-auto d-flex align-items-center">
                <span class="badge bg-dark border border-secondary me-3">v0.1 – Static</span>
                <button class="btn btn-outline-secondary btn-sm" data-bs-toggle="modal" data-bs-target="#settingsModal">
                    <i class="fas fa-cog"></i>
                </button>
            </div>
        </div>
    </nav>

    <!-- Main container -->
    <div class="container main-content">
        <!-- Search section -->
        <div class="search-card">
            <h4 class="mb-4"><i class="fas fa-search me-2"></i>Analiză indicator de compromitere (IOC)</h4>
            <form id="scanForm" class="row g-3">
                <div class="col-md-4">
                    <label for="typeSelect" class="form-label">Tip indicator</label>
                    <select id="typeSelect" class="form-select">
                        <option value="ip">Adresă IP</option>
                        <option value="domain">Domeniu</option>
                        <option value="url">URL</option>
                        <option value="hash">Hash fișier</option>
                        <option value="email">Email</option>
                    </select>
                </div>
                <div class="col-md-6">
                    <label for="queryInput" class="form-label">Valoare</label>
                    <input type="text" id="queryInput" class="form-control" placeholder="Introduceți indicatorul..." required>
                </div>
                <div class="col-md-2 d-flex align-items-end">
                    <button type="submit" class="btn btn-scan w-100">
                        <i class="fas fa-bolt me-1"></i> Scanează
                    </button>
                </div>
            </form>
            <div id="errorMessage" class="alert alert-danger mt-3" style="display: none;"></div>
        </div>

        <!-- Loading spinner -->
        <div id="loadingSpinner" class="loading-spinner">
            <div class="spinner-border" role="status">
                <span class="visually-hidden">Se încarcă...</span>
            </div>
            <p class="mt-2">Interogăm API-urile...</p>
        </div>

        <!-- Results section -->
        <div id="resultsContainer" style="display: none;">
            <!-- Result cards will be inserted here -->
        </div>
    </div>

    <!-- Modal pentru setări API -->
    <div class="modal fade" id="settingsModal" tabindex="-1" aria-labelledby="settingsModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content bg-dark text-light border-secondary">
                <div class="modal-header border-secondary">
                    <h5 class="modal-title" id="settingsModalLabel">Setări API</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label for="hibpKey" class="form-label">Cheie API Have I Been Pwned (opțional)</label>
                        <input type="password" class="form-control" id="hibpKey" placeholder="Introduceți cheia HIBP">
                        <div class="form-text text-muted">Obțineți o cheie gratuită de la haveibeenpwned.com/API/Key. Este salvată local în browser.</div>
                    </div>
                </div>
                <div class="modal-footer border-secondary">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Anulează</button>
                    <button type="button" class="btn btn-primary" id="saveHibpKey">Salvează</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Script propriu -->
    <script src="script.js"></script>
</body>
</html>
